version: 2

project_name: arduino-test-buddy

builds:
  - main: ./cmd/arduino-test-buddy
    binary: arduino-test-buddy
    env:
      - CGO_ENABLED=0
    # Windows developers use WSL, where the linux build applies; the cache lock relies on Unix file locks.
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/robgee86/arduino-test-buddy/internal/version.Version={{.Version}}

archives:
  - formats: [tar.gz]

checksum:
  name_template: checksums.txt

# release-please publishes the release with its notes; goreleaser only attaches the archives.
release:
  mode: keep-existing

changelog:
  disable: true
