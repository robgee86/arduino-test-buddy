version: "3"

vars:
  VERSION:
    sh: echo "${VERSION:-$(git describe --tags --always --dirty 2>/dev/null || echo 0.0.0-dev)}"
  LDFLAGS: -s -w -X github.com/robgee86/arduino-test-buddy/internal/version.Version={{.VERSION}}

tasks:
  default:
    deps: [check]

  build:
    desc: Build the binary for the host platform into dist/
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o dist/arduino-test-buddy ./cmd/arduino-test-buddy

  install:
    desc: Install the binary into GOPATH/bin
    cmds:
      - go install -ldflags "{{.LDFLAGS}}" ./cmd/arduino-test-buddy

  test:
    desc: Run the tests
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format the sources
    cmds:
      - gofmt -w cmd internal

  fmt:check:
    desc: Fail if sources are not gofmt-clean
    cmds:
      - test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal; exit 1)

  check:
    desc: Full verification (fmt, vet, tests)
    deps: [fmt:check, vet]
    cmds:
      - task: test

  release:snapshot:
    desc: Build every platform locally with goreleaser, no publish
    cmds:
      - goreleaser release --snapshot --clean

  mcp:add:
    desc: Register the installed binary as a user-scoped MCP server in Claude Code
    cmds:
      - claude mcp add --scope user arduino-test-buddy -- arduino-test-buddy mcp
